# Dataset-free tests on CPU: models, data readers on synthetic files, training loop, tracking, protocol, tables from
# results/stats, release table and the Thermal Watch app logic. Tests that need datasets or weights skip themselves.
name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: CPU PyTorch
        run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Package
        run: pip install -e .[dev]
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Thermal Watch tests
        run: python -B apps/thermal_watch/tests/test_thermal_watch.py
      - name: Tables are reproducible from results/stats
        run: |
          python -B scripts/compare.py --table results/contrasts.yaml
          python -B scripts/compare.py --detectors results/contrasts_detectors.yaml
          python -B scripts/evaluate_hituav.py --table
          git diff --exit-code -- results/RESULTS.md results/summary.csv results/DETECTORS.md results/summary_detectors.csv results/HITUAV.md
