# Published contrasts (scripts/compare.py --table results/contrasts.yaml).
# Each entry: dataset, detector tag, arm A, arm B (run-tag variants), classes, group, pre-registered prediction id (or null).
# Every entry is evaluated for both trackers (ByteTrack, OC-SORT) with cross-fitted thresholds (rule "cross").
# d = HOTA(A) - HOTA(B). Holm families: (dataset, class, tracker) over the entries of this file.
# Variants: 416 / 640 = plain YOLO canvas width, WxH = compute-matched uniform canvas, s3x / s3y = anisotropic P3 module,
# 416_p2 = plain 416 canvas with an extra stride-4 (P2) detection level (reference only; that model is not part of this repository).

